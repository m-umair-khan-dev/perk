<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 270" width="1080" height="270">
  <!-- Perk tray icons side by side: Off (silver), Waiting (amber outline),
       Awake (amber) and Paused (blue badge). Shapes mirror src/icon/render.rs. -->
  <style>
    .tile  { fill: #F4F5F7; stroke: #E3E6EA; stroke-width: 1.5; }
    .ready { fill: #FFFAF2; stroke: #F7E3C4; stroke-width: 1.5; }
    .glow  { fill: #FFF4E2; stroke: #F7D7A6; stroke-width: 1.5; }
    .calm  { fill: #EEF4FE; stroke: #C9DBFB; stroke-width: 1.5; }
    .label { font: 600 20px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #374151; }
    .hint  { font: 400 14px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6B7280; }
    .arrow { stroke: #C4C9D0; }
    @media (prefers-color-scheme: dark) {
      .tile  { fill: #1F2329; stroke: #30363D; }
      .ready { fill: #241D16; stroke: #4A3A28; }
      .glow  { fill: #2B2118; stroke: #5A4126; }
      .calm  { fill: #18212F; stroke: #2B3E5C; }
      .label { fill: #E6EDF3; }
      .hint  { fill: #9AA4AF; }
      .arrow { stroke: #4B535C; }
    }
  </style>
  <defs>
    <g id="handle-saucer">
      <path d="M41 30.8 A7.04 7.04 0 1 1 41 45.6" fill="none" stroke-width="5.12"/>
      <rect x="3.2" y="56.0" width="47.36" height="5.12" rx="2.56" stroke="none"/>
    </g>
    <g id="outline-cup">
      <rect x="11.36" y="28.64" width="28.48" height="22.08" rx="2.72" fill="none" stroke-width="4.8"/>
      <use href="#handle-saucer"/>
    </g>
    <path id="arrow" d="M0 0 H28 M18 -10 L28 0 L18 10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- Off: silver outline cup -->
  <rect class="tile" x="50" y="10" width="200" height="200" rx="44"/>
  <g transform="translate(85.2 30.8) scale(2.4)" fill="#98A0A8" stroke="#98A0A8">
    <use href="#outline-cup"/>
  </g>
  <text class="label" x="150" y="244" text-anchor="middle">Off</text>
  <text class="hint" x="150" y="264" text-anchor="middle">sleeps as usual</text>

  <use class="arrow" href="#arrow" x="266" y="110"/>

  <!-- Waiting: amber outline cup -->
  <rect class="ready" x="310" y="10" width="200" height="200" rx="44"/>
  <g transform="translate(345.2 30.8) scale(2.4)" fill="#F5A02B" stroke="#F5A02B">
    <use href="#outline-cup"/>
  </g>
  <text class="label" x="410" y="244" text-anchor="middle">Waiting</text>
  <text class="hint" x="410" y="264" text-anchor="middle">starts when you step away</text>

  <use class="arrow" href="#arrow" x="526" y="110"/>

  <!-- Awake: amber cup with steam -->
  <rect class="glow" x="570" y="10" width="200" height="200" rx="44"/>
  <g transform="translate(605.2 30.8) scale(2.4)" fill="#F5A02B" stroke="#F5A02B">
    <rect x="8.96" y="26.24" width="33.28" height="26.88" rx="5.12" stroke="none"/>
    <use href="#handle-saucer"/>
    <g fill="none" stroke-width="3.33" stroke-linecap="round" opacity="0.9">
      <path d="M17.3 5.1 C19.5 8.5 19.5 12 17.3 13.2 C15 14.6 15 18.5 17.3 21.1"/>
      <path d="M25.6 5.1 C27.8 8.5 27.8 12 25.6 13.2 C23.3 14.6 23.3 18.5 25.6 21.1"/>
      <path d="M33.9 5.1 C36.1 8.5 36.1 12 33.9 13.2 C31.6 14.6 31.6 18.5 33.9 21.1"/>
    </g>
  </g>
  <text class="label" x="670" y="244" text-anchor="middle">Awake</text>
  <text class="hint" x="670" y="264" text-anchor="middle">stays on for you</text>

  <use class="arrow" href="#arrow" x="786" y="110"/>

  <!-- Paused: amber outline cup with a blue pause badge -->
  <rect class="calm" x="830" y="10" width="200" height="200" rx="44"/>
  <g transform="translate(865.2 30.8) scale(2.4)" fill="#F5A02B" stroke="#F5A02B">
    <use href="#outline-cup"/>
    <circle class="calm" cx="48" cy="17.28" r="17.92" stroke="none"/>
    <circle cx="48" cy="17.28" r="14.72" fill="#4285F4" stroke="none"/>
    <rect x="42.69" y="10.88" width="3.58" height="12.8" rx="1.28" fill="#FFFFFF" stroke="none"/>
    <rect x="49.73" y="10.88" width="3.58" height="12.8" rx="1.28" fill="#FFFFFF" stroke="none"/>
  </g>
  <text class="label" x="930" y="244" text-anchor="middle">Paused</text>
  <text class="hint" x="930" y="264" text-anchor="middle">lid closed or battery low</text>
</svg>
